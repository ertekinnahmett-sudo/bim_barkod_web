<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BİM Barkod</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .header {
      background: #e30613;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #e30613;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .yesil {
      background: #198754;
    }

    .urun {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-top: 10px;
    }

    .urun strong {
      display: block;
      font-size: 19px;
      margin-bottom: 7px;
    }

    .kod {
      color: #e30613;
      font-size: 20px;
      font-weight: bold;
    }

    .sonuc {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .bulunamadi {
      color: #e30613;
      text-align: center;
      padding: 10px;
    }

    #reader {
      width: 100%;
      margin-top: 10px;
    }

  </style>
</head>

<body>

  <div class="header">
    🛒 BİM Barkod
  </div>

  <div class="container">

    <!-- KAMERA -->

    <div class="card">

      <h2>📷 Barkod Okut</h2>

      <button onclick="kamerayiAc()">
        Kamerayı Aç
      </button>

      <div id="reader"></div>

      <div id="sonuc" class="sonuc">
        Kamera kapalı
      </div>

    </div>


    <!-- ARAMA -->

    <div class="card">

      <h2>🔎 Ürün Ara</h2>

      <input
        type="text"
        id="arama"
        placeholder="Ürün adı veya barkod..."
        oninput="urunleriGoster()"
      >

    </div>


    <!-- ÜRÜN EKLE -->

    <div class="card">

      <h2>➕ Ürün Ekle</h2>

      <input
        type="text"
        id="urunAdi"
        placeholder="Ürün adı"
      >

      <input
        type="text"
        id="barkod"
        placeholder="Uzun barkod"
      >

      <input
        type="text"
        id="kisaKod"
        placeholder="Kısa kasa kodu"
      >

      <button onclick="urunEkle()">
        Ürün Ekle
      </button>

    </div>


    <!-- ÜRÜNLER -->

    <div class="card">

      <h2>📦 Ürünler</h2>

      <div id="urunListesi"></div>

    </div>

  </div>


  <script>

    let urunler = JSON.parse(
      localStorage.getItem("bimBarkodUrunler")
    ) || [];

    let okuyucu = null;


    // ÜRÜN EKLE

    function urunEkle() {

      const ad =
        document.getElementById("urunAdi")
          .value.trim();

      const barkod =
        document.getElementById("barkod")
          .value.trim();

      const kod =
        document.getElementById("kisaKod")
          .value.trim();


      if (!ad || !barkod || !kod) {

        alert("Lütfen bütün alanları doldur.");

        return;
      }


      urunler.push({

        ad: ad,

        barkod: barkod,

        kod: kod

      });


      localStorage.setItem(

        "bimBarkodUrunler",

        JSON.stringify(urunler)

      );


      document.getElementById("urunAdi").value = "";

      document.getElementById("barkod").value = "";

      document.getElementById("kisaKod").value = "";


      urunleriGoster();

    }


    // ÜRÜNLERİ GÖSTER

    function urunleriGoster() {

      const liste =
        document.getElementById("urunListesi");

      const arama =
        document.getElementById("arama")
          .value.toLowerCase();


      liste.innerHTML = "";


      const bulunanlar =
        urunler.filter(urun =>

          urun.ad.toLowerCase().includes(arama) ||

          urun.barkod.includes(arama) ||

          urun.kod.includes(arama)

        );


      if (bulunanlar.length === 0) {

        liste.innerHTML =
          '<div class="bulunamadi">Ürün bulunamadı.</div>';

        return;

      }


      bulunanlar.forEach(urun => {

        liste.innerHTML += `

          <div class="urun">

            <strong>${urun.ad}</strong>

            Barkod: ${urun.barkod}<br>

            Kısa Kod:

            <span class="kod">
              ${urun.kod}
            </span>

          </div>

        `;

      });

    }


    // BARKOD OKUMA

    function barkodBulundu(barkod) {

      const urun =
        urunler.find(
          u => u.barkod === barkod
        );


      // ÜRÜN VARSA

      if (urun) {

        document.getElementById("sonuc").innerHTML = `

          <div class="urun">

            <strong>✅ ${urun.ad}</strong>

            Barkod: ${urun.barkod}<br>

            Kısa Kasa Kodu:

            <div class="kod">
              ${urun.kod}
            </div>

          </div>

        `;

        return;

      }


      // ÜRÜN YOKSA

      document.getElementById("sonuc").innerHTML = `

        <div class="urun">

          <strong>❌ Barkod bulunamadı</strong>

          <div style="margin-top:10px;">
            ${barkod}
          </div>

          <button
            class="yesil"
            onclick="bulunamayanUrunuEkle('${barkod}')"
          >
            ➕ Bu Ürünü Ekle
          </button>

        </div>

      `;

    }


    // BULUNAMAYAN ÜRÜNÜ EKLEME FORMUNA GÖNDER

    function bulunamayanUrunuEkle(barkod) {

      document.getElementById("barkod").value =
        barkod;


      document.getElementById("urunAdi")
        .focus();


      window.scrollTo({

        top:
          document.getElementById("urunAdi")
            .offsetTop - 100,

        behavior: "smooth"

      });

    }


    // KAMERA

    function kamerayiAc() {

      if (okuyucu) {

        return;

      }


      okuyucu =
        new Html5Qrcode("reader");


      okuyucu.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {

            width: 280,

            height: 160

          }

        },

        (barkod) => {

          document.getElementById("arama")
            .value = barkod;


          barkodBulundu(barkod);


          urunleriGoster();

        },

        () => {}

      )

      .catch(() => {

        document.getElementById("sonuc")
          .textContent =
          "Kamera açılamadı.";

        okuyucu = null;

      });

    }


    urunleriGoster();

  </script>

</body>
</html>
