<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BİM Barkod</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .header {
      background: #e30613;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #e30613;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #c9000b;
    }

    .urun {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }

    .urun strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .kod {
      color: #e30613;
      font-weight: bold;
    }

    .bos {
      text-align: center;
      color: #777;
      padding: 15px;
    }

    #kamera {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    #kameraDurum {
      text-align: center;
      margin-top: 10px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="header">
    🛒 BİM Barkod
  </div>

  <div class="container">

    <div class="card">
      <h2>📷 Barkod Okut</h2>

      <button onclick="kamerayiAc()">
        Kamerayı Aç
      </button>

      <video id="kamera" autoplay playsinline></video>

      <div id="kameraDurum">
        Kamera kapalı
      </div>
    </div>

    <div class="card">
      <h2>Ürün Ara</h2>

      <input
        type="text"
        id="arama"
        placeholder="Ürün adı veya barkod..."
        oninput="urunleriGoster()"
      >
    </div>

    <div class="card">
      <h2>Ürün Ekle</h2>

      <input
        type="text"
        id="urunAdi"
        placeholder="Ürün adı"
      >

      <input
        type="text"
        id="barkod"
        placeholder="Uzun barkod"
      >

      <input
        type="text"
        id="kisaKod"
        placeholder="Kısa kasa kodu"
      >

      <button onclick="urunEkle()">
        Ürün Ekle
      </button>
    </div>

    <div class="card">
      <h2>Ürünler</h2>

      <div id="urunListesi"></div>
    </div>

  </div>

  <script>

    let urunler = JSON.parse(
      localStorage.getItem("bimBarkodUrunler")
    ) || [];

    let kameraAkisi = null;

    function urunEkle() {

      const ad =
        document.getElementById("urunAdi").value.trim();

      const barkod =
        document.getElementById("barkod").value.trim();

      const kod =
        document.getElementById("kisaKod").value.trim();

      if (!ad || !barkod || !kod) {
        alert("Lütfen bütün alanları doldur.");
        return;
      }

      urunler.push({
        ad: ad,
        barkod: barkod,
        kod: kod
      });

      localStorage.setItem(
        "bimBarkodUrunler",
        JSON.stringify(urunler)
      );

      document.getElementById("urunAdi").value = "";
      document.getElementById("barkod").value = "";
      document.getElementById("kisaKod").value = "";

      urunleriGoster();
    }

    function urunleriGoster() {

      const liste =
        document.getElementById("urunListesi");

      const arama =
        document
          .getElementById("arama")
          .value
          .toLowerCase();

      liste.innerHTML = "";

      const bulunanlar = urunler.filter(urun =>
        urun.ad.toLowerCase().includes(arama) ||
        urun.barkod.includes(arama) ||
        urun.kod.includes(arama)
      );

      if (bulunanlar.length === 0) {
        liste.innerHTML =
          '<div class="bos">Ürün bulunamadı.</div>';
        return;
      }

      bulunanlar.forEach(urun => {

        liste.innerHTML += `
          <div class="urun">
            <strong>${urun.ad}</strong>
            Barkod: ${urun.barkod}<br>
            Kısa Kod:
            <span class="kod">${urun.kod}</span>
          </div>
        `;

      });
    }

    async function kamerayiAc() {

      const video = document.getElementById("kamera");
      const durum = document.getElementById("kameraDurum");

      try {

        kameraAkisi =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: {
                ideal: "environment"
              }
            },
            audio: false
          });

        video.srcObject = kameraAkisi;
        video.style.display = "block";

        durum.textContent =
          "Kamera açık 📷";

      } catch (hata) {

        durum.textContent =
          "Kamera açılamadı. Kamera iznini kontrol et.";

        alert(
          "Kameraya erişim izni verilmedi veya kamera kullanılamıyor."
        );
      }
    }

    urunleriGoster();

  </script>

</body>
</html>
