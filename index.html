<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BİM Barkod</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .header {
      background: #e30613;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #e30613;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .urun {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }

    .urun strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .kod {
      color: #e30613;
      font-weight: bold;
    }

    .bos {
      text-align: center;
      color: #777;
      padding: 15px;
    }

    #reader {
      width: 100%;
      margin-top: 10px;
    }

    #sonuc {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="header">
    🛒 BİM Barkod
  </div>

  <div class="container">

    <div class="card">

      <h2>📷 Barkod Okut</h2>

      <button onclick="barkodOkuyucuyuAc()">
        Kamerayı Aç
      </button>

      <div id="reader"></div>

      <div id="sonuc">
        Kamera kapalı
      </div>

    </div>

    <div class="card">

      <h2>Ürün Ara</h2>

      <input
        type="text"
        id="arama"
        placeholder="Ürün adı veya barkod..."
        oninput="urunleriGoster()"
      >

    </div>

    <div class="card">

      <h2>Ürün Ekle</h2>

      <input
        type="text"
        id="urunAdi"
        placeholder="Ürün adı"
      >

      <input
        type="text"
        id="barkod"
        placeholder="Uzun barkod"
      >

      <input
        type="text"
        id="kisaKod"
        placeholder="Kısa kasa kodu"
      >

      <button onclick="urunEkle()">
        Ürün Ekle
      </button>

    </div>

    <div class="card">

      <h2>Ürünler</h2>

      <div id="urunListesi"></div>

    </div>

  </div>

  <script>

    let urunler = JSON.parse(
      localStorage.getItem("bimBarkodUrunler")
    ) || [];

    let okuyucu = null;

    function urunEkle() {

      const ad =
        document.getElementById("urunAdi").value.trim();

      const barkod =
        document.getElementById("barkod").value.trim();

      const kod =
        document.getElementById("kisaKod").value.trim();

      if (!ad || !barkod || !kod) {
        alert("Lütfen bütün alanları doldur.");
        return;
      }

      urunler.push({
        ad: ad,
        barkod: barkod,
        kod: kod
      });

      localStorage.setItem(
        "bimBarkodUrunler",
        JSON.stringify(urunler)
      );

      document.getElementById("urunAdi").value = "";
      document.getElementById("barkod").value = "";
      document.getElementById("kisaKod").value = "";

      urunleriGoster();
    }

    function urunleriGoster() {

      const liste =
        document.getElementById("urunListesi");

      const arama =
        document
          .getElementById("arama")
          .value
          .toLowerCase();

      liste.innerHTML = "";

      const bulunanlar = urunler.filter(urun =>
        urun.ad.toLowerCase().includes(arama) ||
        urun.barkod.includes(arama) ||
        urun.kod.includes(arama)
      );

      if (bulunanlar.length === 0) {
        liste.innerHTML =
          '<div class="bos">Ürün bulunamadı.</div>';
        return;
      }

      bulunanlar.forEach(urun => {

        liste.innerHTML += `
          <div class="urun">
            <strong>${urun.ad}</strong>
            Barkod: ${urun.barkod}<br>
            Kısa Kod:
            <span class="kod">${urun.kod}</span>
          </div>
        `;

      });
    }

    function barkodOkuyucuyuAc() {

      if (okuyucu) {
        return;
      }

      okuyucu = new Html5Qrcode("reader");

      okuyucu.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 150
          }
        },

        (barkod) => {

          document.getElementById("arama").value = barkod;

          document.getElementById("sonuc").textContent =
            "Barkod okundu: " + barkod;

          urunleriGoster();

        },

        () => {
          // Barkod bulunamadığında burada hiçbir şey yapmıyoruz.
        }

      ).catch((hata) => {

        document.getElementById("sonuc").textContent =
          "Kamera açılamadı.";

        okuyucu = null;

      });
    }

    urunleriGoster();

  </script>

</body>
</html>
