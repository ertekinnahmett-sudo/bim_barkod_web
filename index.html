<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const app=initializeApp({

  apiKey:"AIzaSyBIrLxs1fmO9kLDTU0ot6loZzUeBRGY9Zk",

  authDomain:"bim-kod.firebaseapp.com",

  projectId:"bim-kod",

  storageBucket:"bim-kod.firebasestorage.app",

  messagingSenderId:"212381326013",

  appId:"1:212381326013:web:232e46710316de346ab5d4"

});


const db=getFirestore(app);


/* =========================
   DEĞİŞKENLER
========================= */

let products=
  JSON.parse(
    localStorage.getItem("bimBarkodUrunler")
  )||[];

let scanner=null;
let galleryScanner=null;

let flash=false;
let lastBarcode="";
let manualTimer=null;

let cameras=[];
let cameraIndex=0;
let currentCameraId=null;

let editingBarcode="";

let focusHoldTimer=null;
let focusActive=false;


/* =========================
   GÜVENLİ METİN
========================= */

const safe=value=>
  String(value||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");


/* =========================
   LOCAL KAYIT
========================= */

const localSave=()=>{

  localStorage.setItem(
    "bimBarkodUrunler",
    JSON.stringify(products)
  );

};


/* =========================
   EKRAN DEĞİŞTİR
========================= */

function show(id){

  document
    .querySelectorAll(".screen")
    .forEach(screen=>
      screen.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);

}


/* =========================
   FIREBASE'DEN ÜRÜNLERİ ÇEK
========================= */

async function loadFirebase(){

  try{

    const snapshot=
      await getDocs(
        collection(db,"barkodlar")
      );


    const merged=
      new Map(
        products.map(product=>[
          product.barkod,
          product
        ])
      );


    snapshot.docs.forEach(item=>{

      const data=item.data();


      merged.set(

        data.barkod||item.id,

        {
          ad:
            data.ad||
            data.urunAdi||
            "Ürün adı girilmemiş",

          barkod:
            data.barkod||
            item.id,

          kod:
            data.kisakod||
            data.kisaKod||
            data.kod||
            ""
        }

      );

    });


    products=[
      ...merged.values()
    ];


    localSave();

    renderProducts();


  }catch(error){

    console.error(
      "Firebase yükleme hatası:",
      error
    );

  }

}


/* =========================
   ANA SAYFA
========================= */

window.goHome=async()=>{

  await stopCamera();

  clearTimeout(manualTimer);

  document
    .getElementById("manualCard")
    .classList.remove("show");

  document
    .getElementById("addCard")
    .classList.remove("show");

  document
    .getElementById("scanResult")
    .innerHTML="";

  show("home");

};


window.openScan=async()=>{

  document
    .getElementById("manualCard")
    .classList.remove("show");

  document
    .getElementById("addCard")
    .classList.remove("show");

  document
    .getElementById("scanResult")
    .innerHTML="";

  document
    .getElementById("manualBarcode")
    .value="";

  show("scan");

  await startCamera();

};


window.openSaved=()=>{

  renderProducts();

  show("saved");

};


/* =========================
   ÜRÜN LİSTESİ
========================= */

window.renderProducts=()=>{

  const q=
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const list=
    products.filter(product=>

      String(product.ad)
        .toLowerCase()
        .includes(q)

      ||

      String(product.barkod)
        .includes(q)

      ||

      String(product.kod)
        .includes(q)

    );


  document
    .getElementById("productList")
    .innerHTML=

    list.length

    ?

    list.map(product=>`

      <article class="product">

        <strong>
          ${safe(product.ad)}
        </strong>

        <div class="info">

          Barkod:
          ${safe(product.barkod)}

          <br>

          Kısa kod:
          <b>${safe(product.kod)}</b>

        </div>


        <div class="product-actions">

          <button
            class="edit-btn"
            onclick="editProduct('${safe(product.barkod)}')"
          >

            <span class="mi">edit</span>

            Düzenle

          </button>


          <button
            class="delete-btn"
            onclick="deleteProduct('${safe(product.barkod)}')"
          >

            <span class="mi">delete</span>

            Sil

          </button>

        </div>

      </article>

    `).join("")

    :

    '<div class="empty">Henüz gösterilecek barkod yok.</div>';

};


/* =========================
   BARKOD SONUCU
========================= */

function showResult(barcode){

  const cleanBarcode=
    String(barcode||"").trim();


  if(!cleanBarcode){

    return;

  }


  const product=
    products.find(
      item=>String(item.barkod)===cleanBarcode
    );


  const result=
    document.getElementById("scanResult");


  const addCard=
    document.getElementById("addCard");


  if(product){

    addCard.classList.remove("show");


    result.innerHTML=`

      <div class="result-box">

        <strong>
          ✓ ${safe(product.ad)}
        </strong>

        Barkod:
        ${safe(product.barkod)}

        <br>

        Kısa kasa kodu:

        <div class="code">
          ${safe(product.kod)}
        </div>

      </div>

    `;

    return;

  }


  document
    .getElementById("newBarcode")
    .value=cleanBarcode;


  document
    .getElementById("shortCode")
    .value="";


  result.innerHTML=`

    <div class="result-box">

      <strong>
        Bu barkod kayıtlı değil
      </strong>

      Barkod:
      ${safe(cleanBarcode)}

    </div>

  `;


  addCard.classList.add("show");


  document
    .getElementById("shortCode")
    .focus();

}


/* =========================
   MANUEL BARKOD
========================= */

window.searchManualBarcode=()=>{

  const barcode=
    document
      .getElementById("manualBarcode")
      .value
      .trim();


  if(!barcode){

    alert(
      "Lütfen barkod numarasını yaz."
    );

    return;

  }


  showResult(barcode);

};


/* =========================
   YENİ ÜRÜN KAYDET
========================= */

window.saveProduct=async()=>{

  const barkod=
    document
      .getElementById("newBarcode")
      .value
      .trim();


  const kod=
    document
      .getElementById("shortCode")
      .value
      .trim();


  if(!barkod){

    alert(
      "Barkod bulunamadı."
    );

    return;

  }


  if(!kod){

    alert(
      "Lütfen kısa kasa kodunu yaz."
    );

    return;

  }


  try{

    await setDoc(

      doc(
        db,
        "barkodlar",
        barkod
      ),

      {
        barkod:barkod,
        kisakod:kod,
        tarih:serverTimestamp()
      },

      {
        merge:true
      }

    );


    const product={
      ad:"",
      barkod:barkod,
      kod:kod
    };


    const index=
      products.findIndex(
        item=>item.barkod===barkod
      );


    if(index<0){

      products.push(product);

    }else{

      products[index]={
        ...products[index],
        kod:kod
      };

    }


    localSave();

    renderProducts();


    document
      .getElementById("addCard")
      .classList.remove("show");


    showResult(barkod);


  }catch(error){

    console.error(error);

    alert(
      "Ürün Firebase'e kaydedilemedi."
    );

  }

};


/* =========================
   DÜZENLE
========================= */

window.editProduct=(barcode)=>{

  const product=
    products.find(
      item=>item.barkod===barcode
    );


  if(!product){

    alert(
      "Ürün bulunamadı."
    );

    return;

  }


  editingBarcode=barcode;


  document
    .getElementById("editBarcode")
    .value=product.barkod;


  document
    .getElementById("editName")
    .value=product.ad||"";


  document
    .getElementById("editShortCode")
    .value=product.kod||"";


  show("edit");

};


window.closeEdit=()=>{

  editingBarcode="";

  show("saved");

};


window.updateProduct=async()=>{

  if(!editingBarcode){

    alert(
      "Düzenlenecek ürün bulunamadı."
    );

    return;

  }


  const name=
    document
      .getElementById("editName")
      .value
      .trim();


  const kod=
    document
      .getElementById("editShortCode")
      .value
      .trim();


  if(!kod){

    alert(
      "Lütfen kısa kasa kodunu yaz."
    );

    return;

  }


  try{

    await setDoc(

      doc(
        db,
        "barkodlar",
        editingBarcode
      ),

      {
        barkod:editingBarcode,
        ad:name,
        kisakod:kod,
        tarih:serverTimestamp()
      },

      {
        merge:true
      }

    );


    const index=
      products.findIndex(
        item=>item.barkod===editingBarcode
      );


    if(index>=0){

      products[index]={
        ...products[index],
        ad:name,
        kod:kod
      };

    }


    localSave();

    editingBarcode="";


    alert(
      "Ürün başarıyla güncellendi."
    );


    renderProducts();

    show("saved");


  }catch(error){

    console.error(error);

    alert(
      "Ürün güncellenemedi."
    );

  }

};


/* =========================
   SİL
========================= */

window.deleteProduct=async(barcode)=>{

  const product=
    products.find(
      item=>item.barkod===barcode
    );


  if(!product){

    alert(
      "Ürün bulunamadı."
    );

    return;

  }


  const confirmed=
    confirm(

      "Bu barkodu silmek istediğine emin misin?\n\n"

      +

      (product.ad||"Ürün")

      +

      "\nBarkod: "

      +

      barcode

    );


  if(!confirmed)return;


  try{

    await deleteDoc(
      doc(
        db,
        "barkodlar",
        barcode
      )
    );


    products=
      products.filter(
        item=>item.barkod!==barcode
      );


    localSave();

    renderProducts();


    alert(
      "Barkod başarıyla silindi."
    );


  }catch(error){

    console.error(error);

    alert(
      "Barkod silinemedi."
    );

  }

};


/* =========================
   KAMERA LİSTESİ
========================= */

async function getCameraList(){

  try{

    const list=
      await Html5Qrcode.getCameras();


    cameras=
      Array.isArray(list)
      ?list
      :[];


    if(currentCameraId){

      const found=
        cameras.findIndex(
          camera=>
            camera.id===currentCameraId
        );


      if(found>=0){

        cameraIndex=found;

      }

    }


    return cameras;


  }catch(error){

    console.error(error);

    cameras=[];

    return [];

  }

}


/* =========================
   DOKUNARAK ODAKLAMA
========================= */

async function focusCamera(event){

  const video=
    document.querySelector(
      "#reader video"
    );


  const track=
    video
      ?.srcObject
      ?.getVideoTracks?.()[0];


  const status=
    document.getElementById(
      "cameraStatus"
    );


  const message=
    document.getElementById(
      "focusMessage"
    );


  if(!track){

    status.textContent=
      "Kamera henüz hazır değil.";

    return;

  }


  const capabilities=
    track.getCapabilities?.()||{};


  if(
    !capabilities.focusMode &&
    !capabilities.focusDistance
  ){

    status.textContent=
      "Bu cihaz/tarayıcı dokunarak odaklamayı desteklemiyor.";

    return;

  }


  const rect=
    video.getBoundingClientRect();


  const x=
    Math.max(
      0,
      Math.min(
        1,
        (event.clientX-rect.left)/
        rect.width
      )
    );


  const y=
    Math.max(
      0,
      Math.min(
        1,
        (event.clientY-rect.top)/
        rect.height
      )
    );


  try{

    const constraints={
      advanced:[]
    };


    if(
      capabilities.focusMode
        ?.includes("continuous")
    ){

      constraints.advanced.push({
        focusMode:"continuous"
      });

    }else if(
      capabilities.focusMode
        ?.includes("single-shot")
    ){

      constraints.advanced.push({
        focusMode:"single-shot"
      });

    }


    if(
      capabilities.pointsOfInterest
    ){

      constraints.advanced.push({

        pointsOfInterest:[
          {
            x:x*100,
            y:y*100
          }
        ]

      });

    }


    if(
      constraints.advanced.length
    ){

      await track.applyConstraints(
        constraints
      );

    }


    message.style.left=
      (x*100)+"%";

    message.style.top=
      (y*100)+"%";

    message.style.opacity="1";


    clearTimeout(
      window.focusMessageTimer
    );


    window.focusMessageTimer=
      setTimeout(()=>{

        message.style.opacity="0";

      },700);


    status.textContent=
      "Odaklandı.";


  }catch(error){

    console.warn(error);

    status.textContent=
      "Odaklama desteklenmiyor.";

  }

}


function attachFocusHandler(){

  const video=
    document.querySelector(
      "#reader video"
    );


  if(
    !video ||
    video.dataset.focusAttached==="1"
  ){

    return;

  }


  video.dataset.focusAttached="1";


  video.addEventListener(
    "click",
    focusCamera
  );


  video.addEventListener(
    "touchend",
    event=>{

      if(
        event.changedTouches?.[0]
      ){

        const touch=
          event.changedTouches[0];


        focusCamera({

          clientX:touch.clientX,
          clientY:touch.clientY

        });

      }

    },
    {
      passive:true
    }
  );

}

async function setContinuousFocus(active){

  const video=
    document.querySelector(
      "#reader video"
    );


  const track=
    video
      ?.srcObject
      ?.getVideoTracks?.()[0];


  const status=
    document.getElementById(
      "cameraStatus"
    );


  const button=
    document.getElementById(
      "focusBtn"
    );


  if(!track)return;


  const capabilities=
    track.getCapabilities?.()||{};


  try{

    if(active){

      if(
        capabilities.focusMode
          ?.includes("continuous")
      ){

        await track.applyConstraints({
          advanced:[
            {
              focusMode:"continuous"
            }
          ]
        });


        focusActive=true;

        button?.classList.add("on");

        if(status){

          status.textContent=
            "Sürekli odaklama açık.";

        }


      }else if(
        capabilities.focusMode
          ?.includes("single-shot")
      ){

        await track.applyConstraints({
          advanced:[
            {
              focusMode:"single-shot"
            }
          ]
        });


        focusActive=true;

        button?.classList.add("on");

        if(status){

          status.textContent=
            "Odaklama yapılıyor...";

        }


      }else{

        if(status){

          status.textContent=
            "Bu cihazda odaklama desteği yok.";

        }

      }


    }else{

      focusActive=false;

      button?.classList.remove("on");


      if(status){

        status.textContent=
          "Barkodu çerçevenin ortasında tut.";

      }

    }


  }catch(error){

    console.warn(error);

    focusActive=false;

    button?.classList.remove("on");


    if(status){

      status.textContent=
        "Odaklama desteklenmiyor.";

    }

  }

}


function setupFocusButton(){

  const button=
    document.getElementById(
      "focusBtn"
    );


  if(
    !button ||
    button.dataset.bound==="1"
  ){

    return;

  }


  button.dataset.bound="1";


  const start=e=>{

    e.preventDefault();

    clearTimeout(
      focusHoldTimer
    );


    focusHoldTimer=
      setTimeout(
        ()=>setContinuousFocus(true),
        180
      );

  };


  const end=e=>{

    e.preventDefault();

    clearTimeout(
      focusHoldTimer
    );


    if(focusActive){

      setContinuousFocus(false);

    }

  };


  button.addEventListener(
    "pointerdown",
    start
  );

  button.addEventListener(
    "pointerup",
    end
  );

  button.addEventListener(
    "pointercancel",
    end
  );

  button.addEventListener(
    "pointerleave",
    end
  );

}

async function startCamera(){

  if(scanner)return;


  const status=
    document.getElementById(
      "cameraStatus"
    );


  status.textContent=
    "Kamera açılıyor...";


  try{

    if(!cameras.length){

      await getCameraList();

    }


    scanner=
      new Html5Qrcode(
        "reader"
      );


    let cameraConfig={
      facingMode:"environment"
    };


    if(currentCameraId){

      cameraConfig={
        deviceId:{
          exact:currentCameraId
        }
      };


    }else if(cameras.length){

      const backIndex=
        cameras.findIndex(
          camera=>
            /back|rear|environment|arka/i
              .test(
                camera.label||""
              )
        );


      if(backIndex>=0){

        cameraIndex=
          backIndex;


        currentCameraId=
          cameras[backIndex].id;


        cameraConfig={
          deviceId:{
            exact:currentCameraId
          }
        };

      }

    }


    await scanner.start(

      cameraConfig,

      {

        fps:10,

        qrbox:{
          width:300,
          height:160
        },

        aspectRatio:1.333333,

        disableFlip:true

      },


      async barcode=>{

        if(
          barcode===lastBarcode
        ){

          return;

        }


        lastBarcode=barcode;


        await stopCamera();

        clearTimeout(
          manualTimer
        );


        showResult(
          barcode
        );


        status.textContent=
          "Barkod okundu.";

      },


      ()=>{}

    );


    setTimeout(
      attachFocusHandler,
      300
    );


    status.textContent=
      "Barkodu çerçevenin ortasında tut. Odaklamak için görüntüye dok.";


    manualTimer=
      setTimeout(()=>{

        document
          .getElementById(
            "manualCard"
          )
          .classList.add("show");

      },2000);


  }catch(error){

    console.error(
      "Kamera hatası:",
      error
    );


    status.textContent=
      "Kamera açılamadı.";


    scanner=null;


    document
      .getElementById(
        "manualCard"
      )
      .classList.add("show");

  }

}

async function stopCamera(){

  if(!scanner)return;


  const active=scanner;

  scanner=null;


  const message=
    document.getElementById(
      "focusMessage"
    );


  if(message){

    message.style.opacity="0";

  }


  focusActive=false;


  document
    .getElementById(
      "focusBtn"
    )
    ?.classList.remove("on");


  flash=false;

  updateFlashButton();


  try{

    await active.stop();

  }catch(error){

    console.warn(error);

  }


  try{

    await active.clear();

  }catch(error){

    console.warn(error);

  }

}

window.toggleFlash=async()=>{

  const track=
    document
      .querySelector(
        "#reader video"
      )
      ?.srcObject
      ?.getVideoTracks?.()[0];


  const status=
    document.getElementById(
      "cameraStatus"
    );


  if(!track){

    status.textContent=

      !track.getCapabilities?.().torch
    ){

    status.textContent=
      "Flaş açılamadı.";

  }

};


/* =========================================================
   GALERİDEN BARKOD OKUMA
   ========================================================= */


/*
  Fotoğrafı daha uygun hale getiriyoruz.
  Özellikle telefonla çekilmiş fotoğraflarda:
  - çok büyük çözünürlük
  - düşük kontrast
  - gölgeler
  - barkodun küçük kalması
  gibi problemler olabiliyor.
*/

function prepareImageVariants(file){

  return new Promise((resolve,reject)=>{

    const image=
      new Image();

    const url=
      URL.createObjectURL(file);


    image.onload=()=>{

      try{

        const maxSize=2000;

        const scale=
          Math.min(
            1,
            maxSize/
            Math.max(
              image.naturalWidth,
              image.naturalHeight
            )
          );


        const width=
          Math.max(
            1,
            Math.round(
              image.naturalWidth*scale
            )
          );


        const height=
          Math.max(
            1,
            Math.round(
              image.naturalHeight*scale
            )
          );


        const canvas=
          document.createElement(
            "canvas"
          );


        canvas.width=width;
        canvas.height=height;


        const ctx=
          canvas.getContext(
            "2d",
            {
              willReadFrequently:true
            }
          );


        ctx.drawImage(
          image,
          0,
          0,
          width,
          height
        );


        const originalCanvas=
          canvas;


        /* Gri ton */
        const grayCanvas=
          document.createElement(
            "canvas"
          );


        grayCanvas.width=width;
        grayCanvas.height=height;


        const grayCtx=
          grayCanvas.getContext(
            "2d",
            {
              willReadFrequently:true
            }
          );


        grayCtx.drawImage(
          image,
          0,
          0,
          width,
          height
        );


        const imageData=
          grayCtx.getImageData(
            0,
            0,
            width,
            height
          );


        const data=
          imageData.data;


        for(
          let i=0;
          i<data.length;
          i+=4
        ){

          const gray=
            0.299*data[i]+
            0.587*data[i+1]+
            0.114*data[i+2];


          data[i]=gray;
          data[i+1]=gray;
          data[i+2]=gray;

        }


        grayCtx.putImageData(
          imageData,
          0,
          0
        );


        /* Kontrast artırılmış */
        const contrastCanvas=
          document.createElement(
            "canvas"
          );


        contrastCanvas.width=width;
        contrastCanvas.height=height;


        const contrastCtx=
          contrastCanvas.getContext(
            "2d",
            {
              willReadFrequently:true
            }
          );


        contrastCtx.drawImage(
          grayCanvas,
          0,
          0
        );


        const contrastData=
          contrastCtx.getImageData(
            0,
            0,
            width,
            height
          );


        const cd=
          contrastData.data;


        const factor=
          (259*(128+80))/
          (255*(259-80));


        for(
          let i=0;
          i<cd.length;
          i+=4
        ){

          const value=
            factor*
            (cd[i]-128)+
            128;


          const v=
            Math.max(
              0,
              Math.min(
                255,
                value
              )
            );


          cd[i]=v;
          cd[i+1]=v;
          cd[i+2]=v;

        }


        contrastCtx.putImageData(
          contrastData,
          0,
          0
        );


        URL.revokeObjectURL(url);


        resolve([

          originalCanvas,

          grayCanvas,

          contrastCanvas

        ]);


      }catch(error){

        URL.revokeObjectURL(url);

        reject(error);

      }

    };


    image.onerror=()=>{

      URL.revokeObjectURL(url);

      reject(
        new Error(
          "Fotoğraf açılamadı."
        )
      );

    };


    image.src=url;

  });

}


/* Canvas -> File */

function canvasToFile(canvas){

  return new Promise(resolve=>{

    canvas.toBlob(
      blob=>{

        if(!blob){

          resolve(null);

          return;

        }


        resolve(
          new File(
            [blob],
            "barkod.jpg",
            {
              type:"image/jpeg",
              lastModified:Date.now()
            }
          )
        );

      },
      "image/jpeg",
      0.95
    );

  });

}

async function scanWithHtml5Qr(file){

  try{

    if(!galleryScanner){

      galleryScanner=
        new Html5Qrcode(
          "galleryReader"
        );

    }


    const result=
      await galleryScanner.scanFile(
        file,
        false
      );


    if(
      result &&
      String(result).trim()
    ){

      return String(result).trim();

    }


  }catch(error){

    console.log(
      "HTML5-Qrcode okuyamadı:",
      error
    );

  }


  return null;

}


/* =========================
   QUAGGA İLE YEDEK TARAMA
========================= */

function scanWithQuagga(file){

  return new Promise(resolve=>{

    let finished=false;


    const finish=code=>{

      if(finished)return;

      finished=true;

      clearTimeout(
        timeout
      );


      try{

        Quagga.stop();

      }catch(e){}


      resolve(
        code||
        null
      );

    };


    const timeout=
      setTimeout(()=>{

        finish(null);

      },7000);


    try{

      const imageUrl=
        URL.createObjectURL(file);


      Quagga.decodeSingle(

        {

          src:imageUrl,

          numOfWorkers:0,

          locate:true,

          inputStream:{
            size:1600,
            singleChannel:false
          },

          locator:{
            patchSize:"medium",
            halfSample:false
          },

          decoder:{
            readers:[
              "ean_reader",
              "ean_8_reader",
              "upc_reader",
              "upc_e_reader",
              "code_128_reader",
              "code_39_reader"
            ],

            multiple:false
          },

          locate:true

        },


        result=>{

          URL.revokeObjectURL(
            imageUrl
          );


          const code=
            result
              ?.codeResult
              ?.code;


          if(code){

            finish(
              String(code)
            );

          }else{

            finish(null);

          }

        }

      );

    }catch(error){

      console.error(
        "Quagga hatası:",
        error
      );


      finish(null);

    }

  });

}

window.scanGallery=async event=>{

    );

    "Fotoğraf hazırlanıyor...";


  try{

      await prepareImageVariants(
        file
      );


    /*
      Önce HTML5-Qrcode.
      Üç farklı görüntü üzerinde deneniyor.
    */

    for(
      let i=0;
      i<variants.length;
      i++
    ){

      status.textContent=

        continue;

      const code=

        );


      if(code){

        showResult(code);

        status.textContent=
          "Fotoğraftaki barkod okundu.";

        return;

      }

    }


    /*
      HTML5-Qrcode bulamadıysa
      Quagga yedek okuyucu devreye giriyor.
    */

    status.textContent=
      "Alternatif barkod okuyucu deneniyor...";


    for(
      let i=0;
      i<variants.length;
      i++
    ){

      const variantFile=
        await canvasToFile(
          variants[i]
        );


      if(!variantFile){

        continue;

      }


      const code=
        await scanWithQuagga(
          variantFile
        );


      if(code){

        showResult(code);

        status.textContent=
          "Fotoğraftaki barkod okundu.";

        return;

      }

    }


    /*

    */

    status.textContent=
      "Barkod okunamadı. Daha net bir fotoğraf seçebilir veya elle girebilirsin.";


    document
      .getElementById(
        "manualCard"
      )
      .classList.add("show");


  }catch(error){

    console.error(
      "Galeri tarama hatası:",
      error
    );


    status.textContent=
      "Fotoğraf işlenemedi. Barkodu elle girebilirsin.";


    document
      .getElementById(
        "manualCard"
      )
      .classList.add("show");

  }

};
