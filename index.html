<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BİM Barkod</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<style>
:root{--bg:#fff9f7;--text:#24201f;--red:#a75a50;--soft:#5e4d49;--pale:#fff0ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{width:min(100%,520px);min-height:100vh;margin:auto;padding:28px 28px 38px}.screen{display:none}.screen.active{display:block}.mi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;vertical-align:middle}.home-title{text-align:center;font-size:30px;font-weight:400;margin:45px 0 0}.hero{min-height:500px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:34px;text-align:center}.scan-icon{font-size:130px;line-height:1;margin-bottom:34px}.brand{font-size:43px;margin:0;font-weight:700}.desc{font-size:23px;margin:24px 0 0}.home-buttons{display:grid;gap:20px}.home-btn{min-height:64px;border-radius:34px;font-size:20px;display:flex;align-items:center;justify-content:center;gap:12px}.scan-btn{border:1px solid #f0ded9;background:var(--pale);color:var(--red);box-shadow:0 3px 4px #41272228}.gallery-btn{border:1px solid #ecd5d0;background:#fff;color:var(--red)}.saved-btn{border:1.5px solid #766866;background:transparent;color:var(--red)}.top{min-height:54px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;margin-bottom:24px}.top h1{text-align:center;font-size:23px;margin:0}.back{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--text)}.card{padding:18px;border:1px solid #eee3e0;border-radius:22px;background:#fff;box-shadow:0 5px 18px #36262312}#reader{min-height:160px;overflow:hidden;border-radius:14px}#reader video{border-radius:12px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.cam-btn{min-height:50px;border:1px solid #e3d4d0;border-radius:14px;background:#fff7f5;color:var(--red);font-weight:700}.cam-btn.on{background:var(--red);border-color:var(--red);color:#fff}.status,.result{min-height:30px;margin-top:15px;color:var(--soft);text-align:center;line-height:1.45}.result-box{margin-top:16px;padding:18px;border-radius:16px;background:#fff4f1;text-align:left}.result-box strong{display:block;margin-bottom:9px;font-size:21px}.code{display:inline-block;margin-top:8px;color:var(--red);font-size:27px;font-weight:700}.add-card{display:none;margin-top:18px}.add-card.show{display:block}.add-card h2{margin:0 0 14px;font-size:20px}input{width:100%;min-height:52px;margin:7px 0;padding:12px 14px;border:1px solid #d8cbc7;border-radius:13px;outline-color:var(--red)}input[readonly]{background:#f7f0ee}.save{width:100%;min-height:52px;margin-top:10px;border:0;border-radius:14px;background:var(--red);color:#fff;font-weight:700}.list{display:grid;gap:11px}.product{padding:15px;border:1px solid #eadeda;border-radius:15px;background:#fffdfc}.product strong{display:block;margin-bottom:8px;font-size:18px}.info{color:var(--soft);line-height:1.5}.empty{padding:32px 12px;text-align:center;color:var(--soft)}@media(max-width:390px){.app{padding:20px}.hero{min-height:445px}.brand{font-size:37px}.desc{font-size:20px}}
</style>
</head>
<body>
<main class="app">
<section id="home" class="screen active">
<h1 class="home-title">BİM Barkod</h1>
<div class="hero"><span class="mi scan-icon">qr_code_scanner</span><h2 class="brand">BİM Barkod</h2><p class="desc">Barkod okut, kısa kodunu kaydet.</p></div>
<div class="home-buttons">
<button class="home-btn scan-btn" onclick="openScan()"><span class="mi">photo_camera</span>Barkod Tara</button>
<button class="home-btn gallery-btn" onclick="document.getElementById('galleryInput').click()"><span class="mi">photo_library</span>Galeriden Tara</button>
<button class="home-btn saved-btn" onclick="openSaved()"><span class="mi">format_list_bulleted</span>Kayıtlı Barkodlar</button>
</div>
<input id="galleryInput" type="file" accept="image/*" hidden onchange="scanGallery(event)">
</section>

<section id="scan" class="screen">
<div class="top"><button class="back" onclick="goHome()"><span class="mi">arrow_back</span></button><h1>Barkod Tara</h1><span></span></div>
<div class="card"><div id="reader"></div><div class="controls">
<button id="flashBtn" class="cam-btn" onclick="toggleFlash()"><span class="mi">flash_on</span> Flaş Aç</button>
<button class="cam-btn" onclick="restartCamera()"><span class="mi">refresh</span> Yeniden Tara</button>
</div><div id="cameraStatus" class="status">Kamera açılıyor...</div><div id="scanResult" class="result"></div></div>
<div id="addCard" class="card add-card"><h2>Yeni barkodu kaydet</h2><input id="newBarcode" readonly><input id="productName" placeholder="Ürün adı"><input id="shortCode" placeholder="Kısa kasa kodu"><button class="save" onclick="saveProduct()">Kaydet</button></div>
</section>

<section id="saved" class="screen">
<div class="top"><button class="back" onclick="goHome()"><span class="mi">arrow_back</span></button><h1>Kayıtlı Barkodlar</h1><span></span></div>
<div class="card"><input id="search" placeholder="Barkod veya ürün ara" oninput="renderProducts()"><div id="productList" class="list"></div></div>
</section>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,getDocs,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyBIrLxs1fmO9kLDTU0ot6loZzUeBRGY9Zk",authDomain:"bim-kod.firebaseapp.com",projectId:"bim-kod",storageBucket:"bim-kod.firebasestorage.app",messagingSenderId:"212381326013",appId:"1:212381326013:web:232e46710316de346ab5d4"});
const db=getFirestore(app);
let products=JSON.parse(localStorage.getItem("bimBarkodUrunler"))||[],scanner=null,flash=false,lastBarcode="";

const safe=v=>String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const localSave=()=>localStorage.setItem("bimBarkodUrunler",JSON.stringify(products));
const show=id=>{document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0)};

async function loadFirebase(){
try{
const snap=await getDocs(collection(db,"barkodlar")),merged=new Map(products.map(p=>[p.barkod,p]));
snap.docs.forEach(d=>{const x=d.data();merged.set(x.barkod||d.id,{ad:x.ad||x.urunAdi||"Ürün adı girilmemiş",barkod:x.barkod||d.id,kod:x.kisakod||x.kisaKod||x.kod||""})});
products=[...merged.values()];localSave();renderProducts();
}catch(e){console.error(e)}
}

window.goHome=async()=>{await stopCamera();document.getElementById("addCard").classList.remove("show");document.getElementById("scanResult").innerHTML="";show("home")};
window.openScan=async()=>{document.getElementById("addCard").classList.remove("show");document.getElementById("scanResult").innerHTML="";show("scan");await startCamera()};
window.openSaved=()=>{renderProducts();show("saved")};

window.renderProducts=()=>{
const q=document.getElementById("search").value.toLowerCase().trim();
const list=products.filter(p=>String(p.ad).toLowerCase().includes(q)||String(p.barkod).includes(q)||String(p.kod).includes(q));
document.getElementById("productList").innerHTML=list.length?list.map(p=>`<article class="product"><strong>${safe(p.ad)}</strong><div class="info">Barkod: ${safe(p.barkod)}<br>Kısa kod: <b>${safe(p.kod)}</b></div></article>`).join(""):'<div class="empty">Henüz gösterilecek barkod yok.</div>';
};

function showResult(barcode){
const p=products.find(x=>x.barkod===barcode),out=document.getElementById("scanResult"),add=document.getElementById("addCard");
if(p){add.classList.remove("show");out.innerHTML=`<div class="result-box"><strong>✓ ${safe(p.ad)}</strong>Barkod: ${safe(p.barkod)}<br>Kısa kasa kodu:<div class="code">${safe(p.kod)}</div></div>`;return}
document.getElementById("newBarcode").value=barcode;document.getElementById("productName").value="";document.getElementById("shortCode").value="";
out.innerHTML=`<div class="result-box"><strong>Bu barkod kayıtlı değil</strong>Barkod: ${safe(barcode)}</div>`;add.classList.add("show");document.getElementById("productName").focus();
}

window.saveProduct=async()=>{
const barkod=document.getElementById("newBarcode").value.trim(),ad=document.getElementById("productName").value.trim(),kod=document.getElementById("shortCode").value.trim();
if(!ad||!kod){alert("Lütfen ürün adını ve kısa kasa kodunu yaz.");return}
try{
await setDoc(doc(db,"barkodlar",barkod),{ad,barkod,kisakod:kod,tarih:serverTimestamp()},{merge:true});
const p={ad,barkod,kod},i=products.findIndex(x=>x.barkod===barkod);i<0?products.push(p):products[i]=p;localSave();renderProducts();document.getElementById("addCard").classList.remove("show");showResult(barkod);
}catch(e){console.error(e);alert("Ürün Firebase'e kaydedilemedi.")}
};

async function startCamera(){
if(scanner)return;const status=document.getElementById("cameraStatus");status.textContent="Kamera açılıyor...";
try{
scanner=new Html5Qrcode("reader");
await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:300,height:160},aspectRatio:1.333333,disableFlip:true},async code=>{if(code===lastBarcode)return;lastBarcode=code;await stopCamera();showResult(code);status.textContent="Barkod okundu."},()=>{});
status.textContent="Barkodu 15–25 cm uzakta ve çerçevenin ortasında tut.";
}catch(e){console.error(e);status.textContent="Kamera açılamadı. Kamera iznini kontrol et.";scanner=null}
}

async function stopCamera(){
if(!scanner)return;const active=scanner;scanner=null;flash=false;flashButton();
try{await active.stop();await active.clear()}catch(e){console.warn(e)}
}

window.restartCamera=async()=>{await stopCamera();lastBarcode="";document.getElementById("scanResult").innerHTML="";document.getElementById("addCard").classList.remove("show");await startCamera()};

function flashButton(){const b=document.getElementById("flashBtn");b.classList.toggle("on",flash);b.innerHTML=flash?'<span class="mi">flash_off</span> Flaş Kapat':'<span class="mi">flash_on</span> Flaş Aç'}

window.toggleFlash=async()=>{
const track=document.querySelector("#reader video")?.srcObject?.getVideoTracks?.()[0],status=document.getElementById("cameraStatus");
if(!track){status.textContent="Önce kameranın açılmasını bekle.";return}
try{
if(!track.getCapabilities?.().torch){status.textContent="Bu tarayıcıda flaş kontrolü desteklenmiyor.";return}
flash=!flash;await track.applyConstraints({advanced:[{torch:flash}]});flashButton();status.textContent=flash?"Flaş açık.":"Flaş kapalı.";
}catch(e){flash=false;flashButton();status.textContent="Flaş açılamadı."}
};

window.scanGallery=async event=>{
const file=event.target.files?.[0];event.target.value="";
if(!file)return;
await stopCamera();document.getElementById("addCard").classList.remove("show");document.getElementById("scanResult").innerHTML="";show("scan");
const status=document.getElementById("cameraStatus");status.textContent="Fotoğraftaki barkod okunuyor...";
let photoScanner=null;
try{
photoScanner=new Html5Qrcode("reader");
const barcode=await photoScanner.scanFile(file,true);
await photoScanner.clear();
showResult(barcode);status.textContent="Fotoğraftaki barkod okundu.";
}catch(e){
console.error(e);if(photoScanner)try{await photoScanner.clear()}catch(_){}
status.textContent="Barkod okunamadı. Daha net ve yakın çekilmiş bir fotoğraf seç.";
}
};

flashButton();renderProducts();loadFirebase();
</script>
</body>
</html>
