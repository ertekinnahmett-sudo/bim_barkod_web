<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const app=initializeApp({

  apiKey:"AIzaSyBIrLxs1fmO9kLDTU0ot6loZzUeBRGY9Zk",

  authDomain:"bim-kod.firebaseapp.com",

  projectId:"bim-kod",

  storageBucket:"bim-kod.firebasestorage.app",

  messagingSenderId:"212381326013",

  appId:"1:212381326013:web:232e46710316de346ab5d4"

});


const db=getFirestore(app);


let products=
  JSON.parse(
    localStorage.getItem(
      "bimBarkodUrunler"
    )
  )||[];


let scanner=null;

let flash=false;

let lastBarcode="";

let manualTimer=null;

let cameras=[];

let cameraIndex=0;

let currentCameraId=null;

let editingBarcode="";


const safe=value=>
  String(value||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");


const localSave=()=>
  localStorage.setItem(
    "bimBarkodUrunler",
    JSON.stringify(products)
  );


function show(id){

  document
    .querySelectorAll(".screen")
    .forEach(
      screen=>
        screen.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);

}


async function loadFirebase(){

  try{

    const snapshot=
      await getDocs(
        collection(
          db,
          "barkodlar"
        )
      );


    const merged=
      new Map(
        products.map(
          product=>[
            product.barkod,
            product
          ]
        )
      );


    snapshot.docs.forEach(item=>{

      const data=item.data();


      merged.set(

        data.barkod||item.id,

        {

          ad:
            data.ad||
            data.urunAdi||
            "Ürün adı girilmemiş",

          barkod:
            data.barkod||
            item.id,

          kod:
            data.kisakod||
            data.kisaKod||
            data.kod||
            ""

        }

      );

    });


    products=[
      ...merged.values()
    ];


    localSave();

    renderProducts();


  }catch(error){

    console.error(error);

  }

}


window.goHome=async()=>{

  await stopCamera();

  clearTimeout(manualTimer);


  document
    .getElementById("manualCard")
    .classList.remove("show");


  document
    .getElementById("addCard")
    .classList.remove("show");


  document
    .getElementById("scanResult")
    .innerHTML="";


  show("home");

};


window.openScan=async()=>{

  document
    .getElementById("manualCard")
    .classList.remove("show");


  document
    .getElementById("addCard")
    .classList.remove("show");


  document
    .getElementById("scanResult")
    .innerHTML="";


  document
    .getElementById("manualBarcode")
    .value="";


  show("scan");


  await startCamera();

};


window.openSaved=()=>{

  renderProducts();

  show("saved");

};


window.renderProducts=()=>{

  const q=
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const list=
    products.filter(product=>

      String(product.ad)
        .toLowerCase()
        .includes(q)

      ||

      String(product.barkod)
        .includes(q)

      ||

      String(product.kod)
        .includes(q)

    );


  document
    .getElementById("productList")
    .innerHTML=

      list.length

      ?

      list.map(product=>`

        <article class="product">

          <strong>
            ${safe(product.ad)}
          </strong>

          <div class="info">

            Barkod:
            ${safe(product.barkod)}

            <br>

            Kısa kod:
            <b>
              ${safe(product.kod)}
            </b>

          </div>


          <div class="product-actions">

            <button
              class="edit-btn"
              onclick="editProduct('${safe(product.barkod)}')"
            >
              <span class="mi">edit</span>
              Düzenle
            </button>


            <button
              class="delete-btn"
              onclick="deleteProduct('${safe(product.barkod)}')"
            >
              <span class="mi">delete</span>
              Sil
            </button>

          </div>

        </article>

      `).join("")

      :

      '<div class="empty">Henüz gösterilecek barkod yok.</div>';

};


function showResult(barcode){

  const product=
    products.find(
      item=>item.barkod===barcode
    );


  const result=
    document.getElementById(
      "scanResult"
    );


  const addCard=
    document.getElementById(
      "addCard"
    );


  if(product){

    addCard.classList.remove(
      "show"
    );


    result.innerHTML=`

      <div class="result-box">

        <strong>
          ✓ ${safe(product.ad)}
        </strong>

        Barkod:
        ${safe(product.barkod)}

        <br>

        Kısa kasa kodu:

        <div class="code">
          ${safe(product.kod)}
        </div>

      </div>

    `;

    return;

  }


  document
    .getElementById("newBarcode")
    .value=barcode;


  document
    .getElementById("shortCode")
    .value="";


  result.innerHTML=`

    <div class="result-box">

      <strong>
        Bu barkod kayıtlı değil
      </strong>

      Barkod:
      ${safe(barcode)}

    </div>

  `;


  addCard.classList.add(
    "show"
  );


  document
    .getElementById("shortCode")
    .focus();

}


window.searchManualBarcode=()=>{

  const barcode=
    document
      .getElementById(
        "manualBarcode"
      )
      .value
      .trim();


  if(!barcode){

    alert(
      "Lütfen barkod numarasını yaz."
    );

    return;

  }


  showResult(barcode);

};


window.saveProduct=async()=>{

  const barkod=
    document
      .getElementById(
        "newBarcode"
      )
      .value
      .trim();


  const kod=
    document
      .getElementById(
        "shortCode"
      )
      .value
      .trim();


  if(!kod){

    alert(
      "Lütfen kısa kasa kodunu yaz."
    );

    return;

  }


  try{

    await setDoc(

      doc(
        db,
        "barkodlar",
        barkod
      ),

      {
        barkod,
        kisakod:kod,
        tarih:serverTimestamp()
      },

      {
        merge:true
      }

    );


    const product={
      ad:"",
      barkod,
      kod
    };


    const index=
      products.findIndex(
        item=>item.barkod===barkod
      );


    if(index<0)

      products.push(product);

    else

      products[index]=product;


    localSave();

    renderProducts();


    document
      .getElementById("addCard")
      .classList.remove(
        "show"
      );


    showResult(barkod);


  }catch(error){

    console.error(error);

    alert(
      "Ürün Firebase'e kaydedilemedi."
    );

  }

};


/* =========================================
   DÜZENLE
========================================= */

window.editProduct=(barcode)=>{

  const product=
    products.find(
      item=>item.barkod===barcode
    );


  if(!product){

    alert(
      "Ürün bulunamadı."
    );

    return;

  }


  editingBarcode=barcode;


  document
    .getElementById(
      "editBarcode"
    )
    .value=product.barkod;


  document
    .getElementById(
      "editName"
    )
    .value=product.ad||"";


  document
    .getElementById(
      "editShortCode"
    )
    .value=product.kod||"";


  show("edit");

};


window.closeEdit=()=>{

  editingBarcode="";

  show("saved");

};


window.updateProduct=async()=>{

  if(!editingBarcode){

    alert(
      "Düzenlenecek ürün bulunamadı."
    );

    return;

  }


  const name=
    document
      .getElementById(
        "editName"
      )
      .value
      .trim();


  const kod=
    document
      .getElementById(
        "editShortCode"
      )
      .value
      .trim();


  if(!kod){

    alert(
      "Lütfen kısa kasa kodunu yaz."
    );

    return;

  }


  try{

    await setDoc(

      doc(
        db,
        "barkodlar",
        editingBarcode
      ),

      {

        barkod:editingBarcode,

        ad:name,

        kisakod:kod,

        tarih:serverTimestamp()

      },

      {
        merge:true
      }

    );


    const index=
      products.findIndex(
        item=>
          item.barkod===editingBarcode
      );


    if(index>=0){

      products[index]={

        ...products[index],

        ad:name,

        kod:kod

      };

    }


    localSave();

    editingBarcode="";


    alert(
      "Ürün başarıyla güncellendi."
    );


    renderProducts();

    show("saved");


  }catch(error){

    console.error(error);

    alert(
      "Ürün güncellenemedi."
    );

  }

};


/* =========================================
   SİL
========================================= */

window.deleteProduct=async barcode=>{

  const product=
    products.find(
      item=>item.barkod===barcode
    );


  if(!product){

    alert(
      "Ürün bulunamadı."
    );

    return;

  }


  const confirmed=
    confirm(

      "Bu barkodu silmek istediğine emin misin?\n\n"+

      (product.ad||"Ürün")+

      "\nBarkod: "+

      barcode

    );


  if(!confirmed)return;


  try{

    await deleteDoc(

      doc(
        db,
        "barkodlar",
        barcode
      )

    );


    products=
      products.filter(
        item=>item.barkod!==barcode
      );


    localSave();

    renderProducts();


    alert(
      "Barkod başarıyla silindi."
    );


  }catch(error){

    console.error(error);

    alert(
      "Barkod silinemedi."
    );

  }

};


/* =========================================
   KAMERA
========================================= */

async function getCameraList(){

  try{

    const list=
      await Html5Qrcode.getCameras();


    cameras=
      Array.isArray(list)
      ?list
      :[];


    if(currentCameraId){

      const found=
        cameras.findIndex(
          camera=>
            camera.id===currentCameraId
        );


      if(found>=0)
        cameraIndex=found;

    }


    return cameras;


  }catch(error){

    console.error(error);

    cameras=[];

    return [];

  }

}


async function focusCamera(event){

  const video=
    document.querySelector(
      "#reader video"
    );


  const track=
    video
      ?.srcObject
      ?.getVideoTracks?.()[0];


  const status=
    document.getElementById(
      "cameraStatus"
    );


  const message=
    document.getElementById(
      "focusMessage"
    );


  if(!track){

    status.textContent=
      "Kamera henüz hazır değil.";

    return;

  }


  const capabilities=
    track.getCapabilities?.()||{};


  if(
    !capabilities.focusMode &&
    !capabilities.focusDistance
  ){

    status.textContent=
      "Bu cihaz/tarayıcı dokunarak odaklamayı desteklemiyor.";

    return;

  }


  const rect=
    video.getBoundingClientRect();


  const x=
    Math.max(
      0,
      Math.min(
        1,
        (event.clientX-rect.left)/
        rect.width
      )
    );


  const y=
    Math.max(
      0,
      Math.min(
        1,
        (event.clientY-rect.top)/
        rect.height
      )
    );


  try{

    const constraints={
      advanced:[]
    };


    if(
      capabilities.focusMode
        ?.includes("continuous")
    ){

      constraints.advanced.push({
        focusMode:"continuous"
      });

    }else if(
      capabilities.focusMode
        ?.includes("single-shot")
    ){

      constraints.advanced.push({
        focusMode:"single-shot"
      });

    }


    if(capabilities.pointsOfInterest){

      constraints.advanced.push({

        pointsOfInterest:[
          {
            x:x*100,
            y:y*100
          }
        ]

      });

    }


    if(constraints.advanced.length){

      await track.applyConstraints(
        constraints
      );

    }


    message.style.left=
      (x*100)+"%";

    message.style.top=
      (y*100)+"%";

    message.style.opacity="1";


    clearTimeout(
      window.focusMessageTimer
    );


    window.focusMessageTimer=
      setTimeout(()=>{

        message.style.opacity="0";

      },700);


    status.textContent=
      "Odaklandı.";


  }catch(error){

    console.warn(error);

    status.textContent=
      "Odaklama desteklenmiyor.";

  }

}


function attachFocusHandler(){

  const video=
    document.querySelector(
      "#reader video"
    );


  if(
    !video ||
    video.dataset.focusAttached==="1"
  )
    return;


  video.dataset.focusAttached="1";


  video.addEventListener(
    "click",
    focusCamera
  );


  video.addEventListener(
    "touchend",
    event=>{

      if(event.changedTouches?.[0]){

        const touch=
          event.changedTouches[0];


        focusCamera({

          clientX:touch.clientX,

          clientY:touch.clientY

        });

      }

    },
    {
      passive:true
    }
  );

}


let focusHoldTimer=null;

let focusActive=false;


async function setContinuousFocus(active){

  const video=
    document.querySelector(
      "#reader video"
    );


  const track=
    video
      ?.srcObject
      ?.getVideoTracks?.()[0];


  const status=
    document.getElementById(
      "cameraStatus"
    );


  const button=
    document.getElementById(
      "focusBtn"
    );


  if(!track)return;


  const capabilities=
    track.getCapabilities?.()||{};


  try{

    if(active){

      if(
        capabilities.focusMode
          ?.includes("continuous")
      ){

        await track.applyConstraints({

          advanced:[
            {
              focusMode:"continuous"
            }
          ]

        });


        focusActive=true;

        button?.classList.add("on");


        if(status)
          status.textContent=
            "Sürekli odaklama açık.";


      }else if(
        capabilities.focusMode
          ?.includes("single-shot")
      ){

        await track.applyConstraints({

          advanced:[
            {
              focusMode:"single-shot"
            }
          ]

        });


        focusActive=true;

        button?.classList.add("on");


        if(status)
          status.textContent=
            "Odaklama yapılıyor...";


      }else{

        if(status)
          status.textContent=
            "Bu cihazda odaklama desteği yok.";

      }


    }else{

      focusActive=false;

      button?.classList.remove("on");


      if(status)
        status.textContent=
          "Barkodu çerçevenin ortasında tut.";

    }


  }catch(error){

    console.warn(error);

    focusActive=false;

    button?.classList.remove("on");


    if(status)
      status.textContent=
        "Odaklama desteklenmiyor.";

  }

}


function setupFocusButton(){

  const button=
    document.getElementById(
      "focusBtn"
    );


  if(
    !button ||
    button.dataset.bound==="1"
  )
    return;


  button.dataset.bound="1";


  const start=e=>{

    e.preventDefault();

    clearTimeout(
      focusHoldTimer
    );


    focusHoldTimer=
      setTimeout(
        ()=>setContinuousFocus(true),
        180
      );

  };


  const end=e=>{

    e.preventDefault();

    clearTimeout(
      focusHoldTimer
    );


    if(focusActive)
      setContinuousFocus(false);

  };


  button.addEventListener(
    "pointerdown",
    start
  );


  button.addEventListener(
    "pointerup",
    end
  );


  button.addEventListener(
    "pointercancel",
    end
  );


  button.addEventListener(
    "pointerleave",
    end
  );

}


async function startCamera(){

  if(scanner)return;


  const status=
    document.getElementById(
      "cameraStatus"
    );


  status.textContent=
    "Kamera açılıyor...";


  try{

    if(!cameras.length)
      await getCameraList();


    scanner=
      new Html5Qrcode(
        "reader"
      );


    let cameraConfig={
      facingMode:"environment"
    };


    if(currentCameraId){

      cameraConfig={
        deviceId:{
          exact:currentCameraId
        }
      };


    }else if(cameras.length){

      const backIndex=
        cameras.findIndex(
          camera=>
            /back|rear|environment|arka/i
              .test(
                camera.label||""
              )
        );


      if(backIndex>=0){

        cameraIndex=backIndex;

        currentCameraId=
          cameras[backIndex].id;


        cameraConfig={
          deviceId:{
            exact:currentCameraId
          }
        };

      }

    }


    await scanner.start(

      cameraConfig,

      {

        fps:10,

        qrbox:{
          width:300,
          height:160
        },

        aspectRatio:1.333333,

        disableFlip:true

      },


      async barcode=>{

        if(
          barcode===lastBarcode
        )
          return;


        lastBarcode=barcode;


        await stopCamera();

        clearTimeout(
          manualTimer
        );


        showResult(barcode);


        status.textContent=
          "Barkod okundu.";

      },


      ()=>{}

    );


    setTimeout(
      attachFocusHandler,
      200
    );


    status.textContent=
      "Barkodu çerçevenin ortasında tut. Odaklamak için görüntüye dok.";


    manualTimer=
      setTimeout(()=>{

        document
          .getElementById(
            "manualCard"
          )
          .classList.add("show");

      },2000);


  }catch(error){

    console.error(error);


    status.textContent=
      "Kamera açılamadı.";


    scanner=null;


    document
      .getElementById(
        "manualCard"
      )
      .classList.add("show");

  }

}


async function stopCamera(){

  if(!scanner)return;


  const active=scanner;

  scanner=null;


  document
    .getElementById("focusMessage")
    .style.opacity="0";


  focusActive=false;


  document
    .getElementById("focusBtn")
    ?.classList.remove("on");


  flash=false;

  updateFlashButton();

  setupFocusButton();


  try{

    await active.stop();

    await active.clear();

  }catch(error){

    console.warn(error);

  }

}


window.restartCamera=async()=>{

  await stopCamera();

  clearTimeout(
    manualTimer
  );

  lastBarcode="";


  document
    .getElementById(
      "scanResult"
    )
    .innerHTML="";


  document
    .getElementById(
      "addCard"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "manualCard"
    )
    .classList.remove(
      "show"
    );


  await startCamera();

};


window.switchCamera=async()=>{

  const status=
    document.getElementById(
      "cameraStatus"
    );


  try{

    await stopCamera();

    clearTimeout(
      manualTimer
    );

    lastBarcode="";


    if(!cameras.length)
      await getCameraList();


    if(cameras.length<2){

      status.textContent=
        "Bu cihazda başka kamera bulunamadı.";

      await startCamera();

      return;

    }


    cameraIndex=
      (cameraIndex+1)%
      cameras.length;


    currentCameraId=
      cameras[cameraIndex].id;


    document
      .getElementById(
        "scanResult"
      )
      .innerHTML="";


    document
      .getElementById(
        "addCard"
      )
      .classList.remove(
        "show"
      );


    document
      .getElementById(
        "manualCard"
      )
      .classList.remove(
        "show"
      );


    status.textContent=
      "Kamera değiştiriliyor...";


    await startCamera();


  }catch(error){

    console.error(error);

    status.textContent=
      "Kamera değiştirilemedi.";

    await startCamera();

  }

};


function updateFlashButton(){

  const button=
    document.getElementById(
      "flashBtn"
    );


  button.classList.toggle(
    "on",
    flash
  );


  button.innerHTML=

    flash

    ?

    '<span class="mi">flash_off</span>Flaş Kapat'

    :

    '<span class="mi">flash_on</span>Flaş Aç';

}


window.toggleFlash=async()=>{

  const track=
    document
      .querySelector(
        "#reader video"
      )
      ?.srcObject
      ?.getVideoTracks?.()[0];


  const status=
    document.getElementById(
      "cameraStatus"
    );


  if(!track){

    status.textContent=
      "Önce kameranın açılmasını bekle.";

    return;

  }


  try{

    if(
      !track.getCapabilities?.()
        .torch
    ){

      status.textContent=
        "Bu tarayıcıda flaş kontrolü desteklenmiyor.";

      return;

    }


    flash=!flash;


    await track.applyConstraints({

      advanced:[
        {
          torch:flash
        }
      ]

    });


    updateFlashButton();


    status.textContent=
      flash
      ?"Flaş açık."
      :"Flaş kapalı.";


  }catch(error){

    flash=false;

    updateFlashButton();

    status.textContent=
      "Flaş açılamadı.";

  }

};


/* =========================================
   GELİŞTİRİLMİŞ GALERİDEN TARAMA
========================================= */

window.scanGallery=async event=>{

  const file=
    event.target.files?.[0];


  event.target.value="";


  if(!file)return;


  await stopCamera();

  clearTimeout(
    manualTimer
  );


  document
    .getElementById(
      "manualCard"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "addCard"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "scanResult"
    )
    .innerHTML="";


  show("scan");


  const status=
    document.getElementById(
      "cameraStatus"
    );


  status.textContent=
    "Fotoğraf hazırlanıyor...";


  const imageUrl=
    URL.createObjectURL(file);


  const image=
    new Image();


  image.onload=()=>{

    try{

      const originalWidth=
        image.naturalWidth;


      const originalHeight=
        image.naturalHeight;


      /*
      -----------------------------------------
      FOTOĞRAFI UYGUN BOYUTA GETİR
      -----------------------------------------
      */

      const maxWidth=2400;


      let width=
        originalWidth;


      let height=
        originalHeight;


      /*
      Küçük fotoğrafları büyüt.
      */

      if(width<1600){

        const scale=
          1600/width;


        width=
          Math.round(
            width*scale
          );


        height=
          Math.round(
            height*scale
          );

      }


      /*
      Çok büyük fotoğrafları sınırla.
      */

      if(width>maxWidth){

        const scale=
          maxWidth/width;


        width=
          Math.round(
            width*scale
          );


        height=
          Math.round(
            height*scale
          );

      }


      /*
      -----------------------------------------
      ORİJİNAL CANVAS
      -----------------------------------------
      */

      const canvas=
        document.createElement(
          "canvas"
        );


      canvas.width=width;

      canvas.height=height;


      const ctx=
        canvas.getContext(
          "2d",
          {
            willReadFrequently:true
          }
        );


      ctx.imageSmoothingEnabled=true;

      ctx.imageSmoothingQuality=
        "high";


      ctx.drawImage(
        image,
        0,
        0,
        width,
        height
      );


      const originalData=
        ctx.getImageData(
          0,
          0,
          width,
          height
        );


      /*
      =========================================
      TARAMA İÇİN GÖRÜNTÜLER
      =========================================
      */

      const images=[];


      /*
      1 — ORİJİNAL
      */

      images.push(
        canvas.toDataURL(
          "image/jpeg",
          0.96
        )
      );


      /*
      2 — GRİ TONLAMA
      */

      const grayCanvas=
        document.createElement(
          "canvas"
        );


      grayCanvas.width=width;

      grayCanvas.height=height;


      const grayCtx=
        grayCanvas.getContext(
          "2d",
          {
            willReadFrequently:true
          }
        );


      const grayData=
        new ImageData(
          new Uint8ClampedArray(
            originalData.data
          ),
          width,
          height
        );


      for(
        let i=0;
        i<grayData.data.length;
        i+=4
      ){

        const r=
          grayData.data[i];


        const g=
          grayData.data[i+1];


        const b=
          grayData.data[i+2];


        const gray=
          0.299*r+
          0.587*g+
          0.114*b;


        grayData.data[i]=gray;

        grayData.data[i+1]=gray;

        grayData.data[i+2]=gray;

      }


      grayCtx.putImageData(
        grayData,
        0,
        0
      );


      images.push(
        grayCanvas.toDataURL(
          "image/jpeg",
          0.96
        )
      );


      /*
      3 — KONTRAST
      */

      const contrastCanvas=
        document.createElement(
          "canvas"
        );


      contrastCanvas.width=width;

      contrastCanvas.height=height;


      const contrastCtx=
        contrastCanvas.getContext(
          "2d",
          {
            willReadFrequently:true
          }
        );


      contrastCtx.drawImage(
        grayCanvas,
        0,
        0
      );


      const contrastData=
        contrastCtx.getImageData(
          0,
          0,
          width,
          height
        );


      const contrastFactor=1.8;


      for(
        let i=0;
        i<contrastData.data.length;
        i+=4
      ){

        let value=
          contrastData.data[i];


        value=
          (
            (value-128)*
            contrastFactor
          )+128;


        value=
          Math.max(
            0,
            Math.min(
              255,
              value
            )
          );


        contrastData.data[i]=value;

        contrastData.data[i+1]=value;

        contrastData.data[i+2]=value;

      }


      contrastCtx.putImageData(
        contrastData,
        0,
        0
      );


      images.push(
        contrastCanvas.toDataURL(
          "image/jpeg",
          0.96
        )
      );


      /*
      4 — SİYAH / BEYAZ
      */

      const bwCanvas=
        document.createElement(
          "canvas"
        );


      bwCanvas.width=width;

      bwCanvas.height=height;


      const bwCtx=
        bwCanvas.getContext(
          "2d",
          {
            willReadFrequently:true
          }
        );


      const bwData=
        contrastCtx.getImageData(
          0,
          0,
          width,
          height
        );


      for(
        let i=0;
        i<bwData.data.length;
        i+=4
      ){

        const value=
          bwData.data[i];


        const bw=
          value>150
          ?255
          :0;


        bwData.data[i]=bw;

        bwData.data[i+1]=bw;

        bwData.data[i+2]=bw;

      }


      bwCtx.putImageData(
        bwData,
        0,
        0
      );


      images.push(
        bwCanvas.toDataURL(
          "image/jpeg",
          0.96
        )
      );


      /*
      5 — KESKİNLEŞTİRİLMİŞ
      */

      const sharpCanvas=
        document.createElement(
          "canvas"
        );


      sharpCanvas.width=width;

      sharpCanvas.height=height;


      const sharpCtx=
        sharpCanvas.getContext(
          "2d",
          {
            willReadFrequently:true
          }
        );


      sharpCtx.drawImage(
        contrastCanvas,
        0,
        0
      );


      const sharpData=
        sharpCtx.getImageData(
          0,
          0,
          width,
          height
        );


      const source=
        new Uint8ClampedArray(
          sharpData.data
        );


      for(
        let y=1;
        y<height-1;
        y++
      ){

        for(
          let x=1;
          x<width-1;
          x++
        ){

          const index=
            (y*width+x)*4;


          const up=
            ((y-1)*width+x)*4;


          const down=
            ((y+1)*width+x)*4;


          const left=
            (y*width+x-1)*4;


          const right=
            (y*width+x+1)*4;


          const center=
            source[index];


          const average=
            (
              source[up]+
              source[down]+
              source[left]+
              source[right]
            )/4;


          let value=
            center+
            (center-average)*1.5;


          value=
            Math.max(
              0,
              Math.min(
                255,
                value
              )
            );


          sharpData.data[index]=value;

          sharpData.data[index+1]=value;

          sharpData.data[index+2]=value;

        }

      }


      sharpCtx.putImageData(
        sharpData,
        0,
        0
      );


      images.push(
        sharpCanvas.toDataURL(
          "image/jpeg",
          0.96
        )
      );


      /*
      =========================================
      QUAGGA AYARLARI
      =========================================
      */

      const configs=[

        {
          size:2400,
          patchSize:"small",
          halfSample:false
        },

        {
          size:2000,
          patchSize:"medium",
          halfSample:false
        },

        {
          size:1600,
          patchSize:"large",
          halfSample:false
        },

        {
          size:2000,
          patchSize:"x-large",
          halfSample:false
        },

        {
          size:1600,
          patchSize:"small",
          halfSample:true
        }

      ];


      /*
      Sadece market barkodlarında
      kullanılan tipleri deniyoruz.
      */

      const readers=[

        "ean_reader",

        "ean_8_reader",

        "upc_reader",

        "upc_e_reader"

      ];


      let finished=false;


      /*
      =========================================
      HER GÖRÜNTÜYÜ DENE
      =========================================
      */

      const tryImage=
        imageIndex=>{

          if(finished)return;


          if(
            imageIndex>=images.length
          ){

            URL.revokeObjectURL(
              imageUrl
            );


            status.innerHTML=
              "Barkod okunamadı.<br>" +
              "Barkodun fotoğrafta daha büyük ve net görünmesini deneyebilirsin.";


            document
              .getElementById(
                "manualCard"
              )
              .classList.add(
                "show"
              );


            return;

          }


          status.textContent=
            "Görüntü işleniyor... " +
            (imageIndex+1)+
            "/"+
            images.length;


          const tryConfig=
            configIndex=>{

              if(finished)return;


              if(
                configIndex>=
                configs.length
              ){

                setTimeout(
                  ()=>tryImage(
                    imageIndex+1
                  ),
                  50
                );

                return;

              }


              const config=
                configs[
                  configIndex
                ];


              status.textContent=
                "Barkod aranıyor...";


              Quagga.decodeSingle(

                {

                  src:
                    images[
                      imageIndex
                    ],

                  numOfWorkers:0,

                  locate:true,

                  inputStream:{

                    size:
                      config.size,

                    singleChannel:false

                  },

                  locator:{

                    patchSize:
                      config.patchSize,

                    halfSample:
                      config.halfSample

                  },

                  decoder:{

                    readers:
                      readers

                  }

                },


                result=>{

                  const code=
                    result
                      ?.codeResult
                      ?.code;


                  if(code){

                    const cleanCode=
                      String(code)
                        .replace(
                          /\D/g,
                          ""
                        );


                    if(

                      cleanCode.length===8 ||

                      cleanCode.length===12 ||

                      cleanCode.length===13

                    ){

                      finished=true;


                      URL.revokeObjectURL(
                        imageUrl
                      );


                      showResult(
                        cleanCode
                      );


                      status.textContent=
                        "✓ Barkod başarıyla okundu.";


                      return;

                    }

                  }


                  setTimeout(

                    ()=>tryConfig(
                      configIndex+1
                    ),

                    50

                  );

                }

              );

            };


          tryConfig(0);

        };


      tryImage(0);


    }catch(error){

      console.error(error);


      URL.revokeObjectURL(
        imageUrl
      );


      status.textContent=
        "Fotoğraf işlenirken hata oluştu.";


      document
        .getElementById(
          "manualCard"
        )
        .classList.add(
          "show"
        );

    }

  };


  image.onerror=()=>{

    URL.revokeObjectURL(
      imageUrl
    );


    status.textContent=
      "Fotoğraf açılamadı.";

  };


  image.src=imageUrl;

};


/* =========================================
   BAŞLANGIÇ
========================================= */

updateFlashButton();

setupFocusButton();

renderProducts();

loadFirebase();

</script>
